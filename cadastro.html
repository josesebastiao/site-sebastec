<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta | PedJá</title>
    <link rel="icon" type="image/png" href="assets/icons/icon-pedja.png">
    <meta name="theme-color" content="#ea580c">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; }
        .bg-pedja-dark { background-color: #0B132B; }
        .text-pedja-dark { color: #0B132B; }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-6 bg-slate-50 relative overflow-hidden">
    <div class="absolute top-0 left-0 w-[500px] h-[500px] bg-orange-500/10 rounded-full blur-3xl -translate-y-1/2 -translate-x-1/2 pointer-events-none"></div>
    <div class="absolute bottom-0 right-0 w-[600px] h-[600px] bg-blue-500/5 rounded-full blur-3xl translate-y-1/3 translate-x-1/3 pointer-events-none"></div>

    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-100 p-8 relative z-10">
        
        <div class="flex justify-center mb-8">
            <a href="pedja.html" class="flex items-center gap-3">
                <div class="w-10 h-10 flex items-center justify-center bg-orange-600 rounded-xl shadow-sm">
                    <i data-lucide="shopping-bag" class="text-white w-6 h-6"></i>
                </div>
                <span class="font-extrabold text-3xl tracking-tight text-orange-600">Ped<span class="text-pedja-dark">Já.</span></span>
            </a>
        </div>

        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold text-slate-800 tracking-tight">Crie sua conta</h2>
            <p class="text-sm text-slate-500 font-medium mt-1">E comece a lucrar mais hoje mesmo.</p>
        </div>

        <form onsubmit="alert('Integração de cadastro em desenvolvimento! Entre em contato no WhatsApp para liberar sua conta: (27) 99955-3035'); return false;" class="space-y-5">
            
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 ml-1">Seu Nome</label>
                <input type="text" required placeholder="João da Silva" class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-lg text-sm font-medium text-slate-700 outline-none focus:bg-white focus:border-orange-500 transition">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 ml-1">E-mail Profissional</label>
                <input type="email" required placeholder="contato@seurestaurante.com" class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-lg text-sm font-medium text-slate-700 outline-none focus:bg-white focus:border-orange-500 transition">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 ml-1">WhatsApp</label>
                    <input type="tel" required placeholder="(00) 00000-0000" class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-lg text-sm font-medium text-slate-700 outline-none focus:bg-white focus:border-orange-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 ml-1">Nome da Loja</label>
                    <input type="text" required placeholder="Açaí do Zé" class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-lg text-sm font-medium text-slate-700 outline-none focus:bg-white focus:border-orange-500 transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 ml-1">Crie uma Senha</label>
                <input type="password" required placeholder="••••••••" class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-lg text-sm font-medium text-slate-700 outline-none focus:bg-white focus:border-orange-500 transition">
            </div>

            <button type="submit" class="w-full mt-2 bg-orange-600 hover:bg-orange-700 text-white font-bold py-4 rounded-lg shadow-md transition transform active:scale-95">
                Criar Minha Conta
            </button>
        </form>

        <p class="text-center text-sm font-medium text-slate-500 mt-8">
            Já tem uma conta? <a href="https://pedja.sebastec.com.br/" class="text-orange-600 font-bold hover:underline">Entre aqui</a>
        </p>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
