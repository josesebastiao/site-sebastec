<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta | PedJá</title>
    <link rel="icon" type="image/png" href="assets/icons/icon-pedja.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; }
        .bg-pedja-dark { background-color: #0B132B; }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-6 bg-slate-50 relative overflow-hidden">
    <div class="absolute top-0 left-0 w-[500px] h-[500px] bg-orange-500/10 rounded-full blur-3xl -translate-y-1/2 -translate-x-1/2 pointer-events-none"></div>

    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-100 p-8 relative z-10">
        
        <div class="flex justify-center mb-8">
            <a href="pedja.html" class="flex items-center gap-3">
                <div class="w-10 h-10 flex items-center justify-center bg-orange-600 rounded-xl shadow-sm">
                    <i data-lucide="shopping-bag" class="text-white w-6 h-6"></i>
                </div>
                <span class="font-extrabold text-3xl tracking-tight text-orange-600">Ped<span class="text-[#0B132B]">Já.</span></span>
            </a>
        </div>

        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold text-slate-800 tracking-tight">Solicite seu Acesso</h2>
            <p class="text-sm text-slate-500 font-medium mt-1">Preencha os dados abaixo e nossa equipe criará sua conta em instantes.</p>
        </div>

        <form action="https://formsubmit.co/sebastectecnologia@gmail.com" method="POST" class="space-y-5">
            
            <input type="hidden" name="_next" value="https://pedja.sebastec.com.br/sucesso.html">
            <input type="hidden" name="_subject" value="NOVO INTERESSADO - PEDJÁ">
            <input type="hidden" name="_captcha" value="false">

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Seu Nome</label>
                <input type="text" name="nome" required placeholder="Ex: João da Silva" class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-lg text-sm font-medium outline-none focus:border-orange-500 transition">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">E-mail para Login</label>
                <input type="email" name="email" required placeholder="Ex: contato@restaurante.com" class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-lg text-sm font-medium outline-none focus:border-orange-500 transition">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">WhatsApp</label>
                    <input type="tel" name="whatsapp" required placeholder="(27) 99999-9999" class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-lg text-sm font-medium outline-none focus:border-orange-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Nome da Loja</label>
                    <input type="text" name="nome_da_loja" required placeholder="Ex: Burger House" class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-lg text-sm font-medium outline-none focus:border-orange-500 transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Plano de Interesse</label>
                <select name="plano" class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-lg text-sm font-bold text-slate-700 outline-none focus:border-orange-500 transition">
                    <option value="delivery_4990">Plano Delivery - R$ 49,90/mês</option>
                    <option value="pro_12990">Plano Pro (Salão) - R$ 129,90/mês</option>
                </select>
            </div>

            <button type="submit" class="w-full mt-2 bg-orange-600 hover:bg-orange-700 text-white font-bold py-4 rounded-lg shadow-md transition transform active:scale-95">
                ENVIAR DADOS PARA ATIVAÇÃO
            </button>
        </form>

        <p class="text-center text-xs font-medium text-slate-400 mt-8 leading-relaxed">
            Ao clicar em enviar, nossa equipe receberá sua solicitação e entrará em contato via WhatsApp para finalizar a configuração da sua loja.
        </p>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
